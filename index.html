<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5c98">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cuaderno">
  <title>Cuaderno de Tratamientos</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header" role="banner">
    <div class="brand-row">
      <div>
        <p class="eyebrow">APP CUADERNO DE TRATAMIENTOS · V 2.18</p>
        <h1>Campaña <span id="activeCampaignLabel">2026</span></h1>
      </div>
      <button id="installHintBtn" class="ghost-btn compact" type="button" title="Instalación">PWA</button>
    </div>
    <label class="global-search-wrap">
      <span class="sr-only">Buscar en tratamientos, productos, incidencias y observaciones</span>
      <input id="globalSearch" type="search" autocomplete="off" placeholder="Buscar tratamientos, productos, incidencias…">
    </label>
    <section id="globalSearchResults" class="search-results hidden" aria-live="polite"></section>
  </header>

  <main id="screen" class="screen" tabindex="-1"></main>

  <nav class="bottom-nav" aria-label="Navegación principal">
    <button type="button" data-screen="home" class="nav-item active"><span>⌂</span><small>Inicio</small></button>
    <button type="button" data-screen="new" class="nav-item"><span>＋</span><small>Nuevo</small></button>
    <button type="button" data-screen="ledger" class="nav-item"><span>▤</span><small>Cuaderno</small></button>
    <button type="button" data-screen="alerts" class="nav-item"><span>!</span><small>Alertas</small></button>
    <button type="button" data-screen="more" class="nav-item"><span>⋯</span><small>Más</small></button>
  </nav>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <div id="modalHost"></div>

  <script src="app.js"></script>
</body>
</html>
